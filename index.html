<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1 id="user-greeting">Привет!</h1>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('habits')">Привычки</button>
                <button class="tab-btn" onclick="switchTab('schedule')">Расписание</button>
            </div>
        </header>

        <main id="content">
            <!-- Вкладка Привычки -->
            <section id="habits-section" class="tab-content active">
                <div class="input-group">
                    <input type="text" id="habit-input" placeholder="Новая привычка...">
                    <button onclick="addHabit()">+</button>
                </div>
                <ul id="habits-list"></ul>
            </section>

            <!-- Вкладка Расписание -->
            <section id="schedule-section" class="tab-content">
                <div class="input-group">
                    <input type="time" id="sched-time">
                    <input type="text" id="sched-task" placeholder="Что сделать?">
                    <button onclick="addSchedule()">+</button>
                </div>
                <ul id="schedule-list"></ul>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
